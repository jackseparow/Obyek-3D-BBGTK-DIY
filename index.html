<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlocksCAD Clone - 3D Block Coding</title>
  
  <!-- Blockly CDN -->
  <script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
  <script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
  <script src="https://unpkg.com/blockly/javascript_compressed.js"></script>
  <script src="https://unpkg.com/blockly/msg/id.js"></script>

  <!-- Three.js CDN (3D Engine Viewport) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #app-header {
      height: 50px;
      background-color: #1e1e2f;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      z-index: 10;
    }
    #app-header h1 {
      font-size: 1.2rem;
      font-weight: 600;
    }
    #btn-render {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 8px 18px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    #btn-render:hover {
      background-color: #218838;
    }
    #main-container {
      display: flex;
      width: 100vw;
      height: calc(100vh - 50px);
    }
    #blockly-div {
      width: 55%;
      height: 100%;
    }
    #viewport-container {
      width: 45%;
      height: 100%;
      position: relative;
      background-color: #141419;
    }
    #canvas3d {
      width: 100%;
      height: 100%;
      display: block;
    }
    #code-preview {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      height: 120px;
      background: rgba(0, 0, 0, 0.75);
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      padding: 10px;
      border-radius: 6px;
      overflow-y: auto;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,0.1);
    }
  </style>
</head>
<body>

  <header id="app-header">
    <h1>BlocksCAD Visual 3D Engine</h1>
    <button id="btn-render" onclick="renderScene()">Render 3D Kode</button>
  </header>

  <main id="main-container">
    <!-- Workspace Blockly -->
    <div id="blockly-div"></div>

    <!-- Viewport 3D Canvas -->
    <div id="viewport-container">
      <canvas id="canvas3d"></canvas>
      <pre id="code-preview">// Kode JavaScript tergenerasi akan muncul di sini...</pre>
    </div>
  </main>

  <!-- Load Modul Custom Blocks 3D (Bahasa Indonesia) -->
  <script src="block_cube.js"></script>
  <script src="block_sphere.js"></script>
  <script src="block_cylinder.js"></script>

  <!-- App Main & 3D Renderer Logic -->
  <script>
    // 1. Inisialisasi Toolbox
    const toolboxXml = `
      <xml id="toolbox" style="display: none">
        <category name="Bentuk 3D" colour="#4C97FF">
          <block type="shape_cube"></block>
          <block type="shape_sphere"></block>
          <block type="shape_cylinder"></block>
        </category>
        <category name="Matematika" colour="#5B80A5">
          <block type="math_number"><field name="NUM">10</field></block>
        </category>
        <category name="Warna" colour="#5BA5A5">
          <block type="colour_picker"><field name="COLOUR">#4c97ff</field></block>
        </category>
      </xml>
    `;

    // 2. Inject Workspace Blockly
    const workspace = Blockly.inject('blockly-div', {
      toolbox: toolboxXml,
      scrollbars: true,
      zoom: {
        controls: true,
        wheel: true,
        startScale: 1.0,
        maxScale: 3,
        minScale: 0.3,
        scaleSpeed: 1.2
      },
      grid: {
        spacing: 20,
        length: 3,
        colour: '#ccc',
        snap: true
      }
    });

    // 3. Setup Three.js Engine
    const canvas = document.getElementById('canvas3d');
    const container = document.getElementById('viewport-container');
    
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1e1e24);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(30, 40, 50);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Pencahayaan
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(20, 40, 20);
    scene.add(dirLight);

    // Grid Floor
    const gridHelper = new THREE.GridHelper(100, 50, 0x00ffcc, 0x444455);
    scene.add(gridHelper);

    // Group Penampung Objek Hasil Generate
    const renderGroup = new THREE.Group();
    scene.add(renderGroup);

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Auto Resize Viewport
    window.addEventListener('resize', () => {
      const width = container.clientWidth;
      const height = container.clientHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    });

    // 4. Eksekusi & Render Kode
    function renderScene() {
      // Clear scene lama
      while(renderGroup.children.length > 0){ 
        const obj = renderGroup.children[0];
        if (obj.geometry) obj.geometry.dispose();
        renderGroup.remove(obj); 
      }

      // Hasilkan Kode dari Blockly Workspace
      const code = javascriptGenerator.workspaceToCode(workspace);
      document.getElementById('code-preview').innerText = code || "// Workspace kosong";

      // Jalankan Kode untuk menambahkan Mesh ke renderGroup
      try {
        const runCode = new Function('sceneGroup', 'THREE', code);
        runCode(renderGroup, THREE);
      } catch (e) {
        console.error("Error eksekusi rendering 3D:", e);
      }
    }
  </script>
</body>
</html>
