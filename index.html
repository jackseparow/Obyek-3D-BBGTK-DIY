<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoBlock BBGTK DIY - 3D Visual Block Coding</title>
  
  <!-- Blockly CDN Core & Generators -->
  <script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
  <script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
  <script src="https://unpkg.com/blockly/javascript_compressed.js"></script>
  <script src="https://unpkg.com/blockly/msg/id.js"></script>

  <!-- Three.js CDN (3D Engine Viewport) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #app-header {
      height: 50px;
      background-color: #1e1e2f;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      z-index: 10;
    }
    #app-header h1 {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    #btn-render {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 8px 18px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    #btn-render:hover {
      background-color: #218838;
    }
    #main-container {
      display: flex;
      width: 100vw;
      height: calc(100vh - 50px);
    }
    #blockly-div {
      width: 55%;
      height: 100%;
    }
    #viewport-container {
      width: 45%;
      height: 100%;
      position: relative;
      background-color: #141419;
    }
    #canvas3d {
      width: 100%;
      height: 100%;
      display: block;
    }
    #code-preview {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      height: 120px;
      background: rgba(0, 0, 0, 0.75);
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      padding: 10px;
      border-radius: 6px;
      overflow-y: auto;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,0.1);
    }
  </style>
</head>
<body>

  <header id="app-header">
    <h1>GeoBlock BBGTK DIY</h1>
    <button id="btn-render" onclick="renderScene()">Render 3D Kode</button>
  </header>

  <main id="main-container">
    <!-- Area Workspace Blockly -->
    <div id="blockly-div"></div>

    <!-- Viewport 3D Canvas -->
    <div id="viewport-container">
      <canvas id="canvas3d"></canvas>
      <pre id="code-preview">// Kode JavaScript tergenerasi akan muncul di sini...</pre>
    </div>
  </main>

  <!-- Modul Custom Blocks JS -->
  <script src="block_cube.js"></script>
  <script src="block_sphere.js"></script>
  <script src="block_cylinder.js"></script>

  <script>
    // Inisialisasi Generator JS Compatibility
    const jsGen = javascript.javascriptGenerator || javascriptGenerator;

    // 1. Inisialisasi Kategori Utama
    const toolboxXml = `
      <xml id="toolbox" style="display: none">
        <!-- 1. Bentuk 3D -->
        <category name="Bentuk 3D" colour="#4C97FF">
          <block type="shape_cube"></block>
          <block type="shape_sphere"></block>
          <block type="shape_cylinder"></block>
        </category>

        <!-- 2. Bentuk 2D -->
        <category name="Bentuk 2D" colour="#9C27B0">
          <!-- Blok 2D akan kita tambahkan berikutnya -->
        </category>

        <!-- 3. Transformasi -->
        <category name="Transformasi" colour="#FF9800">
          <!-- Translasikan, Rotasikan, Skala -->
        </category>

        <!-- 4. Operasi Himpunan (CSG / Boolean) -->
        <category name="Operasi Himpunan" colour="#E91E63">
          <!-- Gabungan (Union), Irisan (Intersection), Selisih (Difference) -->
        </category>

        <!-- 5. Operasi Aritmetika -->
        <category name="Operasi Aritmetika" colour="#5B80A5">
          <block type="math_number"><field name="NUM">10</field></block>
          <block type="math_arithmetic"></block>
          <block type="math_single"></block>
        </category>

        <!-- 6. Logika -->
        <category name="Logika" colour="#5C81A6">
          <block type="controls_if"></block>
          <block type="logic_compare"></block>
          <block type="logic_operation"></block>
          <block type="logic_boolean"></block>
        </category>

        <!-- 7. Iterasi -->
        <category name="Iterasi" colour="#5CA65C">
          <block type="controls_repeat_ext">
            <value name="TIMES">
              <block type="math_number"><field name="NUM">10</field></block>
            </value>
          </block>
          <block type="controls_for">
            <value name="FROM">
              <block type="math_number"><field name="NUM">1</field></block>
            </value>
            <value name="TO">
              <block type="math_number"><field name="NUM">10</field></block>
            </value>
            <value name="BY">
              <block type="math_number"><field name="NUM">1</field></block>
            </value>
          </block>
        </category>

        <!-- 8. Variabel -->
        <category name="Variabel" colour="#A55B80" custom="VARIABLE"></category>

        <!-- 9. Teks -->
        <category name="Teks" colour="#5BA58C">
          <block type="text"></block>
          <block type="text_join"></block>
        </category>
      </xml>
    `;

    // 2. Inject Workspace
    const workspace = Blockly.inject('blockly-div', {
      toolbox: toolboxXml,
      scrollbars: true,
      zoom: {
        controls: true,
        wheel: true,
        startScale: 1.0,
        maxScale: 3,
        minScale: 0.3,
        scaleSpeed: 1.2
      },
      grid: {
        spacing: 20,
        length: 3,
        colour: '#ccc',
        snap: true
      }
    });

    // 3. Setup Three.js Engine
    const canvas = document.getElementById('canvas3d');
    const container = document.getElementById('viewport-container');
    
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1e1e24);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(30, 40, 50);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Pencahayaan
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(20, 40, 20);
    scene.add(dirLight);

    // Grid Floor
    const gridHelper = new THREE.GridHelper(100, 50, 0x00ffcc, 0x444455);
    scene.add(gridHelper);

    // Group Penampung Objek Render
    const renderGroup = new THREE.Group();
    scene.add(renderGroup);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      const width = container.clientWidth;
      const height = container.clientHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    });

    // 4. Render Scene
    function renderScene() {
      while(renderGroup.children.length > 0){ 
        const obj = renderGroup.children[0];
        if (obj.geometry) obj.geometry.dispose();
        renderGroup.remove(obj); 
      }

      const code = jsGen.workspaceToCode(workspace);
      document.getElementById('code-preview').innerText = code || "// Workspace kosong";

      try {
        const runCode = new Function('sceneGroup', 'THREE', code);
        runCode(renderGroup, THREE);
      } catch (e) {
        console.error("Error eksekusi rendering 3D:", e);
      }
    }
  </script>
</body>
</html>
